services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: ${BOT_MEMORY_LIMIT:-256m}
    cpus: "${BOT_CPUS:-0.75}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-intro}:${SERVICE_PASSWORD_POSTGRES:-intro-postgres-password}@postgres:5432/${POSTGRES_DB:-intro_bot}
      BOT_ENABLED: ${BOT_ENABLED:-false}
      DISCORD_TOKENS: ${DISCORD_TOKENS:-${DISCORD_TOKEN:-}}
      COOLDOWN_SECONDS: ${COOLDOWN_SECONDS:-60}
      INTRO_HISTORY_MAX_SCAN: ${INTRO_HISTORY_MAX_SCAN:-5000}
      LEVEL_API_BASE: ${LEVEL_API_BASE:-}
      LEVEL_API_TIMEOUT_SECONDS: ${LEVEL_API_TIMEOUT_SECONDS:-3}
      LEVEL_CACHE_TTL_SECONDS: ${LEVEL_CACHE_TTL_SECONDS:-60}
      USER_STATS_SITE_GUILD_ID: ${USER_STATS_SITE_GUILD_ID:-}
      USER_STATS_SITE_BASE_URL: ${USER_STATS_SITE_BASE_URL:-}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY:-}
    command:
      [
        "sh",
        "-lc",
        'if [ "$${BOT_ENABLED}" != "true" ]; then echo "bot disabled; set BOT_ENABLED=true after stopping the Railway bot"; sleep infinity; fi; ./scripts/start-bot.sh',
      ]

  api:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: ${API_MEMORY_LIMIT:-192m}
    cpus: "${API_CPUS:-0.50}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-intro}:${SERVICE_PASSWORD_POSTGRES:-intro-postgres-password}@postgres:5432/${POSTGRES_DB:-intro_bot}
      INTRO_API_KEY: ${INTRO_API_KEY:-${EXTERNAL_API_KEY:-}}
      INTRO_API_HOST: ${INTRO_API_HOST:-0.0.0.0}
      INTRO_API_PORT: ${INTRO_API_PORT:-8000}
      INTRO_API_AUTH_FAILURE_LIMIT: ${INTRO_API_AUTH_FAILURE_LIMIT:-10}
      INTRO_API_AUTH_FAILURE_WINDOW_SECONDS: ${INTRO_API_AUTH_FAILURE_WINDOW_SECONDS:-60}
      INTRO_API_CORS_ORIGINS: ${INTRO_API_CORS_ORIGINS:-}
      LEVEL_API_BASE: ${LEVEL_API_BASE:-}
      LEVEL_API_TIMEOUT_SECONDS: ${LEVEL_API_TIMEOUT_SECONDS:-3}
      LEVEL_CACHE_TTL_SECONDS: ${LEVEL_CACHE_TTL_SECONDS:-60}
      USER_STATS_SITE_GUILD_ID: ${USER_STATS_SITE_GUILD_ID:-}
      USER_STATS_SITE_BASE_URL: ${USER_STATS_SITE_BASE_URL:-}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY:-}
    command: ["./scripts/start-api.sh"]
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-192m}
    cpus: "${POSTGRES_CPUS:-0.50}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intro_bot}
      POSTGRES_USER: ${POSTGRES_USER:-intro}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-intro-postgres-password}
    volumes:
      - postgres18-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres18-data:
